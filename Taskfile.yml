version: "3"

tasks:
  fmt:
    desc: Format Go source
    cmds:
      - go fmt ./...

  vet:
    desc: Vet Go source
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test -v -count=1 ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  check:
    desc: Format, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Clean build cache
    cmds:
      - go clean -cache -testcache
